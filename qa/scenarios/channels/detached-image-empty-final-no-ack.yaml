title: Detached image with empty final and no ack posts no failure notice

scenario:
  id: detached-image-empty-final-no-ack
  surface: channel
  coverage:
    secondary:
      - media-generation.background-task-creation
      - channels.message-final-reply
  objective: Under message_tool visible replies, a group turn that only starts detached image generation and ends empty (no message send, no sessions_yield) must not post a failure notice for the original turn; the image arrives later.
  gatewayConfigPatch:
    messages:
      visibleReplies: message_tool
      groupChat:
        visibleReplies: message_tool
  successCriteria:
    - The mock turn calls image_generate, then ends with empty text without calling message or sessions_yield.
    - No outbound message in the group is failure-marked.
    - The generated image is delivered to the group once.
  docsRefs:
    - docs/channels/qa-channel.md
    - docs/tools/image-generation.md
  codeRefs:
    - src/auto-reply/reply/agent-runner-failure-reply.ts
    - src/agents/tools/image-generate-tool.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    summary: Drive image_generate -> empty final in a message_tool_only group and verify no failure notice precedes the delivered image.
    config:
      requiredProviderMode: mock-openai
      conversationId: qa-detached-image-no-ack-group
      promptSnippet: detached image no ack qa check
      prompt: "@openclaw detached image no ack qa check: generate a QA lighthouse image."
      settleMs: 5000

flow:
  steps:
    - name: delivers the detached image without an original-turn failure notice
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: this seeded scenario is mock-openai only
        - call: ensureImageGenerationConfigured
          args:
            - ref: env
        - call: reset
        - set: requestCursorBefore
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - set: inboundAtMs
          value:
            expr: Date.now()
        - sendInbound:
            conversation:
              id:
                expr: config.conversationId
              kind: group
            senderId: qa-detached-image-operator
            senderName: QA Detached Image Operator
            text:
              expr: config.prompt
        # Poll the snapshot directly: transport waits abort on any failure-marked
        # outbound, and this scenario must observe (not throw on) such messages.
        - set: mediaMessage
          value:
            expr: "(async () => { const deadline = Date.now() + liveTurnTimeoutMs(env, 60000); do { const message = state.getSnapshot().messages.find((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId && (candidate.attachments?.length ?? 0) > 0); if (message) { return message; } await sleep(100); } while (Date.now() < deadline); throw new Error(`timed out waiting for the generated image; group outbound=${JSON.stringify(state.getSnapshot().messages.filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId).map((candidate) => ({ text: candidate.text, isError: candidate.isError ?? false })))}`); })()"
        - call: sleep
          args:
            - expr: config.settleMs
        - set: groupOutbound
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && message.conversation.id === config.conversationId)"
        - set: outboundSummary
          value:
            expr: "JSON.stringify(groupOutbound.map((message) => ({ text: message.text, isError: message.isError ?? false, attachments: message.attachments?.length ?? 0, msAfterInbound: message.timestamp - inboundAtMs })))"
        - set: scenarioRequests
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.promptSnippet))"
        - set: plannedTools
          value:
            expr: "scenarioRequests.map((request) => request.plannedToolName).filter(Boolean)"
        - assert:
            expr: "plannedTools.length === 1 && plannedTools[0] === 'image_generate'"
            message:
              expr: "`expected only image_generate before the empty final, saw ${JSON.stringify(plannedTools)}`"
        - assert:
            expr: "groupOutbound.filter((message) => message.isError === true || /⚠️/.test(String(message.text ?? ''))).length === 0"
            message:
              expr: "`a detached handoff must not post a failure notice; outbound=${outboundSummary}`"
        - assert:
            expr: "groupOutbound.filter((message) => (message.attachments?.length ?? 0) > 0).length === 1"
            message:
              expr: "`expected the generated image exactly once; outbound=${outboundSummary}`"
      detailsExpr: "`outbound=${outboundSummary}`"
