title: Acknowledged detached image failure posts one failure message

scenario:
  id: yield-rejection-image-failure
  surface: channel
  coverage:
    primary:
      - media-generation.completion-failure-wake
    secondary:
      - channels.message-final-reply
      - agent-runtime.failure-recovery-evidence
  objective: Under message_tool visible replies, a group turn that starts detached image generation, calls sessions_yield, sends a progress ack with message(final=false), and ends empty must post nothing failure-shaped for the original turn; when the image provider later fails, the group receives exactly one user-facing failure message, answered by the completion turn.
  gatewayConfigPatch:
    messages:
      visibleReplies: message_tool
      groupChat:
        visibleReplies: message_tool
  successCriteria:
    - The mock turn calls image_generate, sessions_yield, then message(action=send, final=false), then ends with empty text.
    - The image provider rejects the delayed request, and the completion turn answers the failure event with a failure marker.
    - The group receives the progress ack exactly once and the failure marker exactly once, and nothing else.
    - No ⚠️ warning or empty-reply notice is attributable to the original turn.
  docsRefs:
    - docs/channels/qa-channel.md
    - docs/tools/image-generation.md
  codeRefs:
    - src/agents/tool-terminal-outcome.ts
    - src/agents/tools/sessions-yield-tool.ts
    - src/agents/tools/media-generate-background-completion.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    summary: Drive image_generate -> sessions_yield -> message(final=false) -> empty final with a failing image provider and verify one completion failure message and no original-turn failure notice.
    config:
      requiredProviderMode: mock-openai
      conversationId: qa-yield-image-failure-group
      promptSnippet: yield rejection image failure qa check
      prompt: "@openclaw yield rejection image failure qa check: generate a QA lighthouse image and let me know when it is ready."
      ackMarker: QA-YIELD-REJECTION-ACK
      failedMarker: QA-YIELD-IMAGE-FAILED
      # The mock image provider rejects after 4s; original-turn notices land within ~300ms of the ack.
      completionMinDelayMs: 2000
      settleMs: 15000

flow:
  steps:
    - name: reports the detached image failure once without an original-turn notice
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: this seeded scenario is mock-openai only
        - call: ensureImageGenerationConfigured
          args:
            - ref: env
        - call: reset
        - set: requestCursorBefore
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - sendInbound:
            conversation:
              id:
                expr: config.conversationId
              kind: group
            senderId: qa-yield-operator
            senderName: QA Yield Operator
            text:
              expr: config.prompt
        # Poll the snapshot directly: transport waits abort on the failure-marked
        # outbound this scenario expects.
        - set: ackMessage
          value:
            expr: "(async () => { const deadline = Date.now() + liveTurnTimeoutMs(env, 60000); do { const message = state.getSnapshot().messages.find((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId && String(candidate.text ?? '').includes(config.ackMarker)); if (message) { return message; } await sleep(100); } while (Date.now() < deadline); throw new Error(`timed out waiting for the progress ack; group outbound=${JSON.stringify(state.getSnapshot().messages.filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId).map((candidate) => ({ text: candidate.text, isError: candidate.isError ?? false })))}`); })()"
        - call: sleep
          args:
            - expr: config.settleMs
        - set: groupOutbound
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && message.conversation.id === config.conversationId)"
        - set: outboundSummary
          value:
            expr: "JSON.stringify(groupOutbound.map((message) => ({ text: message.text, isError: message.isError ?? false, attachments: message.attachments?.length ?? 0, msAfterAck: message.timestamp - ackMessage.timestamp })))"
        - set: scenarioRequests
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.promptSnippet))"
        - set: yieldResultRequest
          value:
            expr: "scenarioRequests.find((request) => request.plannedToolName === 'message' && request.plannedToolArgs?.message === config.ackMarker)"
        - set: yieldResultStatus
          value:
            expr: "(/\"status\":\\s*\"([a-z_]+)\"/.exec(String(yieldResultRequest?.toolOutput ?? '')) ?? [])[1] ?? 'unknown'"
        - set: ackOutbound
          value:
            expr: "groupOutbound.filter((message) => String(message.text ?? '').includes(config.ackMarker))"
        - set: laterOutbound
          value:
            expr: "groupOutbound.filter((message) => !String(message.text ?? '').includes(config.ackMarker))"
        - assert:
            expr: "yieldResultRequest?.plannedToolArgs?.final === false && scenarioRequests.filter((request) => request.plannedToolName === 'sessions_yield').length === 1"
            message: expected image_generate -> one sessions_yield -> message(action=send, final=false)
        - assert:
            expr: "ackOutbound.length === 1"
            message:
              expr: "`expected exactly one progress ack in the group; outbound=${outboundSummary}`"
        - assert:
            expr: "laterOutbound.length === 1 && String(laterOutbound[0].text ?? '').includes(config.failedMarker)"
            message:
              expr: "`expected exactly one image failure message besides the ack; sessions_yield status=${yieldResultStatus}; outbound=${outboundSummary}`"
        - assert:
            expr: "laterOutbound[0].timestamp - ackMessage.timestamp >= config.completionMinDelayMs"
            message:
              expr: "`expected the failure message from the delayed completion turn; outbound=${outboundSummary}`"
      detailsExpr: "`sessions_yield status=${yieldResultStatus}; outbound=${outboundSummary}`"
